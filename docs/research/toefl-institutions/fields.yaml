version: "2026-08-17"
usage: "results 中每个 item 的字段定义；不确定或来源不足时必须标注 uncertainty，不得编造。"
field_categories:
  - category: "基本信息"
    fields:
      - name: "entity_name"
        description: "机构/产品/品牌名称，需注明公司主体或品牌升级关系，例如考满分升级为学而思国际。"
        detail_level: "极简"
      - name: "entity_type"
        description: "综合语培、在线题库/模考、留学机构旗下考培、高端规划、官方渠道、AI原生工具、免费内容生态。"
        detail_level: "极简"
      - name: "authority_basis"
        description: "权威度来源：品牌历史、ETS合作/授权、官方报名中心、师资、校区规模、题库规模或第三方排名；需区分自述与第三方证据。"
        detail_level: "详细"
      - name: "current_status_2026"
        description: "截至近6个月是否仍在活跃招生/更新新托福产品；是否有改革专区、新课程或App更新。"
        detail_level: "简要"
  - category: "目标学员与商业定位"
    fields:
      - name: "target_users"
        description: "目标分数段、年龄段、备考周期、留学阶段、自学/报班偏好。"
        detail_level: "简要"
      - name: "price_band"
        description: "班课、一对一、封闭营、会员、积分、模考次数包等价格带；无法核验时标注为估计。"
        detail_level: "详细"
      - name: "monetization_model"
        description: "课程售卖、会员订阅、积分按次扣费、模考包、资料引流后转化、留学服务联动等。"
        detail_level: "详细"
      - name: "conversion_funnel"
        description: "免费资料/模考/公开课/AI诊断到顾问解读、报课、续费、转介绍的链路。"
        detail_level: "详细"
  - category: "产品形态"
    fields:
      - name: "product_surfaces"
        description: "App、小程序、PC Web、线下校区、OMO、直播、录播、一对一、小班、封闭班、出版/硬件。"
        detail_level: "简要"
      - name: "primary_surface"
        description: "用户主要完成备考动作的核心载体及其原因。"
        detail_level: "简要"
      - name: "offline_online_boundary"
        description: "线上工具与线下教学/督学如何分工，是否存在无手机管理、班主任跟进、云端数据沉淀。"
        detail_level: "详细"
  - category: "核心交互闭环"
    fields:
      - name: "diagnostic_onboarding"
        description: "入学测评/基线测试形式、耗时、输出报告、是否解锁后续路径。"
        detail_level: "详细"
      - name: "learning_loop"
        description: "测评-规划-学习-练习-模考-批改-错题-报告-督学的完整闭环与触发条件。"
        detail_level: "详细"
      - name: "practice_experience"
        description: "刷题、精听/精读、口语复述、写作练习、模考、加试模拟、错题本的交互细节。"
        detail_level: "详细"
      - name: "feedback_latency_granularity"
        description: "反馈时延：秒级/分钟级/24-48小时人工；反馈粒度：总分/维度分/逐句/音素级/录屏或轨迹回放。"
        detail_level: "详细"
      - name: "human_ai_service_mix"
        description: "AI、助教、学管师、教师、顾问在服务链路中的分工与交接点。"
        detail_level: "详细"
  - category: "新托福适配与内容能力"
    fields:
      - name: "mst_adaptive_simulation"
        description: "是否支持多阶段自适应、首模块难度路由、随机加试、固定难度Lower/Upper模式；区分真自适应与包装话术。"
        detail_level: "详细"
      - name: "scale_1_to_6_cefr"
        description: "是否完成0-120到1-6分制切换、新旧双轨展示、CEFR对标与院校要求映射。"
        detail_level: "详细"
      - name: "new_format_coverage"
        description: "2026后新题型覆盖率、题库更新速度、新旧题切换开关、模考界面还原度。"
        detail_level: "详细"
      - name: "content_source"
        description: "TPO/真题/官方样题/自研题/教师教研来源；是否说明授权或正版采购。"
        detail_level: "简要"
  - category: "AI与数据能力"
    fields:
      - name: "ai_scoring"
        description: "口语/写作评分能力、是否对标SpeechRater/e-rater、是否展示维度分与置信说明。"
        detail_level: "详细"
      - name: "ai_tutor_interaction"
        description: "对话式助教、数字人考官、模拟面试追问、逐句反馈、学习计划生成等交互。"
        detail_level: "详细"
      - name: "process_data_collection"
        description: "是否采集逐题耗时、答题轨迹、鼠标轨迹、录屏、作答回放；用于诊断还是仅营销展示。"
        detail_level: "详细"
      - name: "personalization"
        description: "错题诊断、能力图谱、预测分、推荐路径、动态难度调整的机制与证据。"
        detail_level: "详细"
  - category: "口碑、合规与风险"
    fields:
      - name: "user_reputation"
        description: "应用市场评分、社媒评价、第三方测评、投诉/退费/保分争议；需标注来源与时间。"
        detail_level: "详细"
      - name: "claims_credibility"
        description: "保分协议、提分数据、公证/背书、名师承诺等可信度与合规风险。"
        detail_level: "详细"
      - name: "teacher_stability"
        description: "师资稳定性、兼职/全职结构、名师依赖、换师风险。"
        detail_level: "简要"
  - category: "对智能体助手启发"
    fields:
      - name: "borrowable_mechanics"
        description: "可直接借鉴的产品形态或交互机制。"
        detail_level: "详细"
      - name: "differentiation_opportunities"
        description: "传统机构/工具未满足或体验割裂处，智能体可差异化的点。"
        detail_level: "详细"
      - name: "avoid_pitfalls"
        description: "过度承诺、伪AI、重销售轻交付、评分不透明、题源合规等应避免问题。"
        detail_level: "详细"
      - name: "mvp_implications"
        description: "对一个学生自用且后续可扩展的智能体助手，MVP应包含/不包含什么。"
        detail_level: "详细"
uncertain:
  - "authority_basis"
  - "price_band"
  - "mst_adaptive_simulation"
  - "ai_scoring"
  - "process_data_collection"
  - "claims_credibility"
  - "teacher_stability"
result_schema:
  required_sections: ["summary", "facts", "analysis", "recommendations", "sources", "uncertainty"]
  evidence_rule: "facts 必须附来源与日期；analysis 必须基于 facts；recommendations 必须给出置信度、适用条件与下一步验证。"
